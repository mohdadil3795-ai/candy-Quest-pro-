name: Build Signed Release APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        run: |
          set +o pipefail
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Signed APK and AAB
        run: |
          npm install -g cordova
          cordova create build_dir com.throne.candyquestpro "Candy Quest Pro" --no-telemetry
          cp index.html build_dir/www/index.html
          if [ -f icon.png ]; then cp icon.png build_dir/icon.png; fi

          cat << 'EOF' > build_dir/config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.throne.candyquestpro" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Candy Quest Pro</name>
              <description>Sweet Match-3 Puzzle Adventure Game</description>
              <author email="mohdadil3795@gmail.com" href="https://candyquestpro.app">Throne Games</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-navigation href="*" />
              <preference name="Orientation" value="portrait" />
              <preference name="Fullscreen" value="true" />
              <preference name="DisallowOverscroll" value="true" />
              <preference name="AndroidXEnabled" value="true" />
              <preference name="android-minSdkVersion" value="24" />
              <preference name="android-targetSdkVersion" value="34" />
              <platform name="android">
                  <icon src="icon.png" />
              </platform>
          </widget>
          EOF

          cd build_dir
          cordova platform add android@13.0.0 --no-telemetry
          cordova plugin add admob-plus-cordova --variable APP_ID_ANDROID=ca-app-pub-2255298899514160~1925829210 --no-telemetry

          keytool -genkeypair -v -keystore candyquest.keystore -alias candyquest -keyalg RSA -keysize 2048 -validity 10000 -storepass CandyQuest2026 -keypass CandyQuest2026 -dname "CN=Candy Quest Pro, OU=Games, O=Throne, L=New Delhi, S=Delhi, C=IN"

          cat << 'EOF' > build.json
          {
            "android": {
              "release": {
                "keystore": "candyquest.keystore",
                "storePassword": "CandyQuest2026",
                "alias": "candyquest",
                "password": "CandyQuest2026",
                "keystoreType": "pkcs12"
              }
            }
          }
          EOF

          cordova build android --release --buildConfig=build.json -- --packageType=apk
          cordova build android --release --buildConfig=build.json -- --packageType=bundle

          mkdir -p "$GITHUB_WORKSPACE/release-files"
          cp platforms/android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/release-files/CandyQuestPro-release.apk"
          cp platforms/android/app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/release-files/CandyQuestPro-release.aab"
          cp candyquest.keystore "$GITHUB_WORKSPACE/release-files/candyquest.keystore"

      - name: Upload Release APK, AAB and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: CandyQuestPro-Release-Build
          path: release-files/
          
